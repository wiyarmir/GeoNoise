apply plugin: 'com.android.application'

// Resolve the Google Maps API key at build time so it never lives in a
// checked-in resource file (GN-13). Precedence:
//   1. MAPS_API_KEY in the repo-root local.properties (per-machine, git-ignored)
//   2. the MAPS_API_KEY environment variable (CI / release builds)
//   3. a non-secret placeholder so a keyless checkout still builds (maps won't render)
def resolveMapsApiKey() {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def fromProps = props.getProperty('MAPS_API_KEY')
        if (fromProps?.trim()) {
            return fromProps.trim()
        }
    }
    def fromEnv = System.getenv('MAPS_API_KEY')
    if (fromEnv?.trim()) {
        return fromEnv.trim()
    }
    return 'YOUR_MAPS_API_KEY'
}

android {
    compileSdk 34

    defaultConfig {
        namespace "es.guillermoorellana.geonoise"
        minSdkVersion 21
        targetSdkVersion 34 // can't move up without updating permissions model
        versionCode 5
        versionName "1.0"
        manifestPlaceholders = [MAPS_API_KEY: resolveMapsApiKey()]
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.maps.android:android-maps-utils:0.4.3'
    implementation 'net.sf.opencsv:opencsv:2.3'
    implementation 'com.androidplot:androidplot-core:0.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment:1.8.1'
    implementation 'androidx.annotation:annotation:1.8.0'
}
