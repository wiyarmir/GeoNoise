apply plugin: 'com.android.application'

// Resolve the Google Maps API key at build time so it never lives in a
// checked-in resource file (GN-13, GN-15). Precedence:
//   1. the MAPS_API_KEY Gradle project property — inject it whichever way
//      Gradle surfaces project properties: on the CLI (-PMAPS_API_KEY=...),
//      in ~/.gradle/gradle.properties (per-user, never committed), or via the
//      ORG_GRADLE_PROJECT_MAPS_API_KEY environment variable (CI-friendly).
//   2. the bare MAPS_API_KEY environment variable (kept for existing CI setups)
//   3. a non-secret placeholder so a keyless checkout still builds (maps won't render)
def resolveMapsApiKey() {
    def fromProperty = findProperty('MAPS_API_KEY')
    if (fromProperty?.toString()?.trim()) {
        return fromProperty.toString().trim()
    }
    def fromEnv = System.getenv('MAPS_API_KEY')
    if (fromEnv?.trim()) {
        return fromEnv.trim()
    }
    return 'YOUR_MAPS_API_KEY'
}

android {
    compileSdk 34

    defaultConfig {
        namespace "es.guillermoorellana.geonoise"
        minSdkVersion 21
        targetSdkVersion 34 // can't move up without updating permissions model
        versionCode 5
        versionName "1.0"
        manifestPlaceholders = [MAPS_API_KEY: resolveMapsApiKey()]
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.maps.android:android-maps-utils:0.4.3'
    implementation 'net.sf.opencsv:opencsv:2.3'
    implementation 'com.androidplot:androidplot-core:0.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.fragment:fragment:1.8.1'
    implementation 'androidx.annotation:annotation:1.8.0'
}
